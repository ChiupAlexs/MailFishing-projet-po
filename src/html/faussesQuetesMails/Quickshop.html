<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuickShop</title>
    <link rel="stylesheet" href="../../css/faussesQuetesMails/Quickshop.css">
</head>
<header>
    <img class="QuickShop" src="../../images/quickShop.png" alt="Logo Quickshop">
</header>
<body>
<div class="container-quickshop">
    <h1 class="SuivreColis">Oh ! Votre colis est en route, suivez le maintenant !</h1>
    <div class="Suivis">
        <img class="commande" src="../../images/fichier.png" alt="commande faite">
        <img class="commande" src="../../images/supprimer.png" alt="commande faite">
        <img class="commande" src="../../images/paquet%20(1).png" alt="paquet attente">
        <img class="commande" src="../../images/supprimer.png" alt="commande faite">
        <img class="commande" src="../../images/avion.png" alt="expedié">
        <img class="commande" src="../../images/supprimer.png" alt="commande faite">
        <img class="commande" src="../../images/paquet%20(1).png" alt="paquet attente">
        <img class="commande" src="../../images/supprimer.png" alt="commande faite">
        <img class="commande" src="../../images/camion-de-livraison.png" alt="cours de livraison">
        <img class="commande" src="../../images/supprimer.png" alt="commande faite">
        <img class="commandeFin" src="../../images/succes.png" alt="arrivé">
    </div>
    <p>Vous pouvez suivre vos colis en appuyant sur le bouton "Suivre"<br> afin de voir quand votre commande sera chez vous.</p>

    <button id="suiviBtn">Suivre📦</button>
</div>

<script src="../../main.js"></script>
<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }

        const buttonQuickShop = document.getElementById("suiviBtn");
        let escapeCount = 0;
        const maxEscapes = 8;
        let clickable = false;

        // Pour éviter que le bouton sorte de l’écran
        const clamp = (num, min, max) => Math.min(Math.max(num, min), max);

        document.addEventListener("mousemove", (e) => {
            if (!buttonQuickShop || clickable) return;

            const rect = buttonQuickShop.getBoundingClientRect();
            const distance = Math.hypot(
                e.clientX - (rect.left + rect.width / 2),
                e.clientY - (rect.top + rect.height / 2)
            );

            // Si la souris approche trop près
            if (distance < 120 && escapeCount < maxEscapes) {
                escapeCount++;

                // Position aléatoire dans la fenêtre
                const maxX = window.innerWidth - rect.width;
                const maxY = window.innerHeight - rect.height;
                const randomX = clamp(Math.random() * maxX, 0, maxX);
                const randomY = clamp(Math.random() * maxY, 0, maxY);

                // Déplacer en douceur
                buttonQuickShop.style.position = "absolute";
                buttonQuickShop.style.left = `${randomX}px`;
                buttonQuickShop.style.top = `${randomY}px`;
            }

            // Après 8 déplacements, il devient cliquable
            if (escapeCount >= maxEscapes && !clickable) {
                clickable = true;
                buttonQuickShop.style.transition = "transform 0.4s ease, background-color 0.4s ease";
            }
        });

        // Clic final
        buttonQuickShop.addEventListener("click", () => {
            if (!clickable) return;

            localStorage.setItem("pagePrincipale", "true");

            buttonQuickShop.classList.add("loading");
            buttonQuickShop.textContent = "En cours...";

            setTimeout(() => {
                buttonQuickShop.classList.remove("loading");
                buttonQuickShop.classList.add("success");
                buttonQuickShop.textContent = "Terminé ✅";

                setTimeout(() => {
                    window.close();
                }, 1500);
            }, 1500);
        });
    });
</script>
</body>
</html>
