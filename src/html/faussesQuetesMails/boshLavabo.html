<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lavabo</title>
    <link rel="stylesheet" href="../../css/faussesQuetesMails/boshLavabo.css">
</head>
<body>
<img src="../../images/BoschFormulaire.png" alt="logo de bosch" class="logo">
<h1>Lavabo en sodium</h1>
<div class="promo">-50%</div>
<img src="../../images/lavabo.jpg" alt="photo de lavabo" class="lavabo">
<p class="prix">250 CHF <strong>500 CHF</strong></p>
<button id="buttonBosh" class="commander" onclick="commander()">COMMANDER MAINTENANT</button>
<audio autoplay>
    <source src="../../sons/lavabo-sodium.mp3"></source>
</audio>
<script src="../../main.js"></script>
<script>


    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }
    });

    document.addEventListener("DOMContentLoaded", () => {

        const buttonBosh = document.getElementById("buttonBosh");

        if (buttonBosh) {
            buttonBosh.addEventListener('click', () => {
                localStorage.setItem("pagePrincipale", "true");
            });
        }

        const button = document.querySelector("button");

        button.addEventListener("click", () => {
            // Met en état loading
            button.classList.add("loading");
            button.textContent = "Paiement en cours...";

            setTimeout(() => {
                button.classList.remove("loading");
                button.classList.add("success");
                button.textContent = "Paiement réussi"
                setTimeout(() => {
                    window.close()
                }, 1500);
            }, 1500);
        });
    });
</script>

</body>
</html>
