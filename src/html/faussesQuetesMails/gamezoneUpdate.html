<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mise à jour</title>
    <link rel="stylesheet" href="../../css/faussesQuetesMails/gamezoneUpdate.css"/>
</head>
<body>
<h1>Téléchargements</h1>
<img class="logo" src="../../images/gameZoneLogo.png">
<div class="container">
    <img src="../../images/sotCover.png" alt="Cover du jeu" id="gameImage">
    <div class="overlay" id="overlay"></div>
    <div class="bannerUpdate" id="banner">Mise à jour requise</div>
    <button class="download-btn" id="downloadBtn" onclick="startDownload()">Télécharger</button>
    <div class="progress-text" id="progressText">0%</div>
</div>

<div id="stars"></div>

<script>
    function startDownload() {
        const btn = document.getElementById("downloadBtn");
        const text = document.getElementById("progressText");
        const overlay = document.getElementById("overlay");
        const img = document.getElementById("gameImage");
        const banner = document.getElementById("banner");

        let progress = 0;
        btn.style.display = "none";
        text.style.display = "block";
        banner.style.display = "none"; // cache la bannière

        const interval = setInterval(() => {
            progress += 2;
            text.textContent = progress + "%";

            overlay.style.height = progress + "%";
            img.style.filter = `grayscale(${100 - progress}%)`;

            if (progress >= 100) {
                clearInterval(interval);
                text.textContent = "Téléchargement terminé ✅";
            } setTimeout(() => window.close(), 7000)
        }, 100);
    }

    function createStars() {
        const container = document.getElementById("stars");
        for (let i = 0; i < 100; i++) {
            const star = document.createElement("span");
            star.classList.add("plus");
            star.textContent = "+";
            star.style.top = Math.random() * 1080 + "px";
            star.style.left = Math.random() * 1920 + "px";
            star.style.fontSize = (12 + Math.random() * 20) + "px";
            star.style.animationDuration = (4 + Math.random() * 4) + "s";
            container.appendChild(star);

            // Supprime et recrée après l’animation pour boucle infinie
            star.addEventListener("animationend", () => {
                star.remove();
                createStars();
            });
        }
    }

    createStars();
    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }
    });

</script>
</body>
</html>
