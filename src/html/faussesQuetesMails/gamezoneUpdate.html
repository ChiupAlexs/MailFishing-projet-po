<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mise à jour</title>
    <link rel="stylesheet" href="../../css/faussesQuetesMails/gamezoneUpdate.css"/>
</head>
<body>

<h1>Téléchargements</h1>
<div class="container">
    <img src="../../images/sotCover.png" alt="Cover du jeu" id="gameImage">
    <div class="overlay" id="overlay"></div>
    <div class="bannerUpdate" id="banner">Mise à jour requise</div>
    <button class="download-btn" id="downloadBtn" onclick="startDownload()">Télécharger</button>
    <div class="progress-text" id="progressText">0%</div>
</div>

<script>
    function startDownload() {
        const btn = document.getElementById("downloadBtn");
        const text = document.getElementById("progressText");
        const overlay = document.getElementById("overlay");
        const img = document.getElementById("gameImage");
        const banner = document.getElementById("banner");

        let progress = 0;
        btn.style.display = "none";
        text.style.display = "block";
        banner.style.display = "none"; // cache la bannière

        const interval = setInterval(() => {
            progress += 2;
            text.textContent = progress + "%";

            overlay.style.height = progress + "%";
            img.style.filter = `grayscale(${100 - progress}%)`;

            if (progress >= 100) {
                clearInterval(interval);
                text.textContent = "Téléchargement terminé ✅";
            } setTimeout(() => window.close(), 7000)
        }, 100);
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }
    });
</script>
</body>
</html>
