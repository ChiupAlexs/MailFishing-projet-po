<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TikTok</title>
    <link rel="stylesheet" href="../../css/faussesQuetesMails/interfaceTiktok.css">
</head>
<body>
<button onclick="window.close()"><img src="../../images/iconQuitter.png" class="closePageBtn"></button>
<div class="phone-frame">
    <div class="video-container">
        <video src="../../vidéos/videoTiktok.mp4" autoplay loop muted></video>
        <audio id="audio" src="../../sons/blidingLights.m4a" autoplay loop></audio>

        <div class="actions">
            <img class="profile" src="../../images/profilTiktok.png" alt="profile">

            <div class="like-btn">
                <img class="icon" id="like-icon" src="../../images/like.png" alt="like">
                <span id="like-count">2.0K</span>
            </div>

            <div class="comment-btn">
                <img class="icon" src="../../images/commenter.png" alt="comment">
                <span>3</span>
            </div>

            <!-- Overlay -->
            <div id="commentOverlay" class="overlay">
                <div class="overlay-content">
                    <div class="overlay-header">
                        <h2>Commentaires</h2>
                        <span class="close-btn">&times;</span>
                    </div>
                    <div class="comment-list">
                        <div class="comment">
                            <p class="author">Alice</p>
                            <p class="text">Super musique, j’adore !</p>
                        </div>
                        <div class="comment">
                            <p class="author">Bob</p>
                            <p class="text">🔥 Ce son est incroyable ! 🔥</p>
                        </div>
                        <div class="comment">
                            <p class="author">Clara</p>
                            <p class="text">Come check my bio 💞</p>
                        </div>
                    </div>
                </div>
            </div>


            <div class="share-btn">
                <img class="icon" src="../../images/partager.png" alt="share">
                <span>12</span>
            </div>

            <div>
                <img class="iconMusic" src="../../images/iconMusicBlidingLights.png" alt="music">
                <span class="musicText">Bliding Lights</span>
            </div>
        </div>

        <div class="video-info">
            <h3>@gngngn_user</h3>
            <p>Juste là pour les good Vibes 🤙 #music #dance #whiteGuyNonchalantPissing</p>
            <p class="hashtags">voir traduction</p>
        </div>
    </div>
</div>

<script>
    function openComments() {
        document.getElementById("commentOverlay").style.display = "flex";
    }

    function closeComments() {
        document.getElementById("commentOverlay").style.display = "none";
    }

    const likeBtn = document.querySelector('.like-btn');
    const likeIcon = document.getElementById('like-icon');
    const likeCount = document.getElementById('like-count');
    let liked = false;

    // Fonction pour convertir K en nombre
    function parseKCount(text) {
        if (text.includes('K')) {
            return parseFloat(text.replace('K', '')) * 1000;
        }
        return parseInt(text);
    }

    // Fonction pour convertir nombre en K avec 1 décimale
    function formatKCount(num) {
        return (num / 1000).toFixed(1) + 'K';
    }

    likeBtn.addEventListener('click', () => {
        let count = parseKCount(likeCount.innerText);

        if (!liked) {
            count += 1;
            liked = true;
            likeIcon.classList.add('like-active');
            likeIcon.style.animation = 'pop 0.5s forwards';
        } else {
            count -= 1;
            liked = false;
            likeIcon.classList.remove('like-active');
            likeIcon.style.animation = '';
        }

        likeCount.innerText = formatKCount(count);
    });
    document.addEventListener("DOMContentLoaded", () => {
        const commentBtn = document.querySelector(".comment-btn");
        const overlay = document.getElementById("commentOverlay");
        const closeBtn = overlay.querySelector(".close-btn");

        // Ouvrir overlay
        commentBtn.addEventListener("click", () => {
            overlay.style.display = "flex"; // rendre visible
            setTimeout(() => overlay.classList.add("active"), 10); // déclenche transition
        });

        // Fermer overlay
        const closeOverlay = () => {
            overlay.classList.remove("active");
            setTimeout(() => overlay.style.display = "none", 300); // attendre la fin de l’anim
        };

        closeBtn.addEventListener("click", closeOverlay);

        // Fermer si clic en dehors
        overlay.addEventListener("click", (e) => {
            if (e.target === overlay) closeOverlay();
        });
    });

    (function(){
        const overlay = document.getElementById('commentOverlay');
        const closeBtn = overlay.querySelector('.close-btn');
        const content = overlay.querySelector('.overlay-content');

        // Ouvre l'overlay : ajouter .show
        // document.getElementById('commentOverlay').classList.add('show');

        // Fermer via bouton
        closeBtn.addEventListener('click', ()=> {
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden', 'true');
        });

        // Fermer si clic en dehors du contenu
        overlay.addEventListener('click', (e) => {
            if (!content.contains(e.target)) {
                overlay.classList.remove('show');
                overlay.setAttribute('aria-hidden', 'true');
            }
        });

        // Fermer via Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('show')) {
                overlay.classList.remove('show');
                overlay.setAttribute('aria-hidden', 'true');
            }
        });
        document.addEventListener("DOMContentLoaded", () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        });
        // Accessibility: when shown, set aria-hidden to false (call this when opening)
        // Example open function:
        window.showComments = function(){
            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
            // move focus to close button for keyboard users
            overlay.querySelector('.close-btn').focus();
        };
        window.hideComments = function(){
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden', 'true');
        };
    })();
</script>
</body>
</html>
