<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../css/faussesQuetesMails/picShare.css">
</head>
<body>
<header>
    <img src="../../images/picShare-no-background.png" alt="" class="logo">
</header>
<main>
<h1>Nouvel abonné</h1>
<p>cette personne s'est abonné à votre compte : </p>

    <div class="subscriber">
        <img src="../../images/cat-pp.png" alt="photo de profile du nouveau abonné" class="photo-profile">
        <p>@RobloxPlayer</p>
        <p>On PicShare</p>
    </div>
    <button id="followBtn" class="bouton-pic-share">S'abonner en retour</button>
</main>
<script src="../../main.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }
        const buttonPicShare = document.getElementById("followBtn");

        if (buttonPicShare) {
            buttonPicShare.addEventListener('click', () => {
                localStorage.setItem("pagePrincipale", "true");
            });
        }
    });
    document.addEventListener("DOMContentLoaded", () => {
        const button = document.querySelector("button");

        button.addEventListener("click", () => {
            setTimeout(() => {
                button.textContent = "Suivi(e)"
                setTimeout(() => {
                    window.close()
                }, 2000);
            }, 500);
        });
    });
</script>
</body>
</html>
