<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Fortnite-Récompense</title>
    <link rel="stylesheet" href="../../css/faussesQuetesMails/recompenseFortnite.css">
</head>
<body>
<h1>Récupère ta récompense !</h1>
<div class="container">
    <img src="../../images/v-bucks.png">
    <p>13500 V-Bucks</p>
    <button id="getBtn">OBTENIR</button>
</div>
<div id="stars"></div>
<script src="../../main.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }

        const buttonFortnite = document.getElementById("getBtn");

        if (buttonFortnite) {
            buttonFortnite.addEventListener('click', () => {
                localStorage.setItem("pagePrincipale", "true");
            });
        }

    });

    document.addEventListener("DOMContentLoaded", () => {
        const button = document.querySelector("button");

        button.addEventListener("click", () => {
            // Empêche tout autre clic
            button.disabled = true;

            // Met en état loading
            button.classList.add("loading");
            button.textContent = "Chargement...";

            // Simulation du chargement (2.5s)
            setTimeout(() => {
                button.classList.remove("loading");
                button.classList.add("success");
                button.textContent = "Récompense obtenue ✅";

                setTimeout(() => {
                    window.close();
                }, 2500);
            }, 2500);
        });
    });

    function createStars() {
        const container = document.getElementById("stars");
        for (let i = 0; i < 300; i++) {
            const star = document.createElement("span");
            star.classList.add("plus");
            star.textContent = "*";
            star.style.top = Math.random() * 1040 + "px";
            star.style.left = Math.random() * 1900 + "px";
            star.style.fontSize = (12 + Math.random() * 20) + "px";
            star.style.animationDuration = (4 + Math.random() * 4) + "s";
            container.appendChild(star);

            // Supprime et recrée après l’animation pour boucle infinie
            star.addEventListener("animationend", () => {
                star.remove();
                createStars();
            });
        }
    }

    createStars();
</script>
</body>
</html>
