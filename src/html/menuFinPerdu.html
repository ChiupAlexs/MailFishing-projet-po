<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Game Over</title>
    <link rel="stylesheet" href="../css/menuFinPerdu.css">
</head>
<body>
<video class="video-bg" autoplay>
    <source src="../vidéos/finPerdu.mp4" type="video/mp4">
</video>

<div id="game-over-screen" class="hidden">
    <span class="game-over">
        <h1 data-text="GAME OVER">GAME OVER</h1>
        <div id="perso-container" style="display: none;">
            <video id="perso-video" src="../vidéos/angry.mp4" autoplay muted playsinline width="400" height="400"></video>
        </div>
    </span>
    <div class="rapports">
        <h1>Erreurs faites dans la partie</h1>
        <img src="../images/next-icon.png" alt="" class="last-icon">
        <img src="../images/next-icon.png" alt="" class="next-icon">
        <p class="pas-de-faute">Vous avez réalisé un sans-faute, Bravo !</p>

        <div class="rapport">
            <h2 class="supprimer-mail">Vous avez ouvert le lien de ce mail</h2>
            <div class="image-mails">
                <img src="" alt="" class="img-mail">
                <img src="" alt="" class="img-pop-up">
            </div>
            <div class="text-rapport">
                <h2 class="titre-rapport"></h2>
                <div class="text"></div>
            </div>
        </div>
        <div class="points"></div>

        <button class="retour-menu-principal" onclick="window.open('MenuDemarrage.html', '_self')">Menu Principal</button>
    </div>
    <!--<button class="retour" onclick="window.location.href='rapport.html'">Rapport de partie</button>-->
</div>
<div class="glitch-overlay"></div>

<script src="../main.js"></script>
<script>
    const persoContainer = document.getElementById('perso-container');
    const persoVideo = document.getElementById('perso-video');
    let currentRapportIndex = 0

    // code pour le rapport
    const mainElement = document.querySelector("div.rapport")
    const buttonRetourMenuPrincipale = document.querySelector(".retour-menu-principal")
    const divPoints = document.querySelector(".points")

    const messageFauteElement = document.querySelector(".supprimer-mail")

    const titreRapport = document.querySelector(".titre-rapport");
    const textRapport = document.querySelector(".text")
    const imgMailElement = document.querySelector(".img-mail");
    const imgPopUpElement = document.querySelector("img.img-pop-up")

    window.addEventListener('load', () => {
        setTimeout(()=> {
            persoContainer.style.display = 'block';
            persoVideo.muted = false;
            persoVideo.currentTime = 0;
            persoVideo.play();
        }, 23900)

        console.log(rapports)
        if (rapports.length === 0) {
            document.querySelector(".pas-de-faute").style.display = "block";
            mainElement.style.display = "none"
        }

        afficherRapport()
        console.log("Rapport de partie")
    })

    function afficherRapport() {

        if (currentRapportIndex >= rapports.length - 1) {
            document.querySelector(".next-icon").style.display = "none";
        } else {
            document.querySelector(".next-icon").style.display = "inline-block";
        }
        if (currentRapportIndex === 0) {
            document.querySelector(".last-icon").style.display = "none";
            document.querySelector(".next-icon").style.right = "calc(-40vw - 40px)";
        } else {
            document.querySelector(".last-icon").style.display = "inline-block";
            document.querySelector(".next-icon").style.right = "calc(-40vw + 10px)";
        }
        let rapport = rapports.at(currentRapportIndex)
        titreRapport.innerText = rapport.realName
        let text = rapport.text.replace(/\n/g, "<br>");
        textRapport.innerHTML = text
        imgMailElement.src = "../images/screen-shot-mails/" + rapport.imgMail
        imgPopUpElement.src = "../images/screen-shot-mails/" + rapport.imgLienPopUp

        if (currentRapportIndex + 1 === rapports.length) {
            buttonRetourMenuPrincipale.style.display = "block";
        } else {
            buttonRetourMenuPrincipale.style.display = "none";
        }

        if (rapport.bonMail) {
            messageFauteElement.innerText = "Vous avez supprimer ce bon mail"
            messageFauteElement.classList.add("supprimer-bon-mail")
            messageFauteElement.classList.remove("ouvert-mauvais-mail")
        } else {
            messageFauteElement.innerText = "Vous avez ouvert le lien de ce mail"
            messageFauteElement.classList.add("ouvert-mauvais-mail")
            messageFauteElement.classList.remove("supprimer-bon-mail")
        }
        divPoints.innerHTML = ""

        for (let index in rapports) {
            console.log(currentRapportIndex + " " + index)
            if (currentRapportIndex == index) {
                divPoints.innerHTML += "<div class='actif'>"
                console.log("yess la teammmmm")
            } else {
                divPoints.innerHTML += "<div class='point'>"
            }
        }
    }

    /*document.addEventListener('DOMContentLoaded', () => {

        rapports = JSON.parse(sessionStorage.getItem('rapports'))

        if (rapports.length === 0) {
            document.querySelector(".pas-de-faute").style.display = "block";
            mainElement.style.display = "none"
        }
        console.log("test")
        afficherRapport()
        console.log("Rapport de partie")

    })*/

    document.querySelector(".next-icon").addEventListener("click", () => {
        currentRapportIndex++
        afficherRapport()
    })

    document.querySelector(".last-icon").addEventListener("click", () => {
        currentRapportIndex--
        afficherRapport()
    })

</script>
</body>
</html>
