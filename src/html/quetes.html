<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quêtes</title>
    <link rel="stylesheet" href="../css/quetes.css">
</head>
<body>
<header>
    <div class="nom-fichier">
        <img src="../images/fichier-text-icon.png" alt="icone du fichier">
        <p>Quêtes.txt</p>
    </div>
    <a href="bureau.html" class="bouton-quitter-fichier">
        <div>
            <img src="../images/bouton-quitter-fichier.png" alt="bouton-quitter-fichier">
        </div>
    </a>
</header>
<main>
    <h1>Les quêtes</h1>

    <!--<div class="taches repPatron">
        <div>
            <img src="" alt="">
        </div>
        <p>Répondre au patron</p>
    </div>-->

    <div class="overlayQuit" id="overlayQuit">
        <div class="popQuitterJeu" id="popQuitterJeuQuetes">
            <h2>Voulez-vous quitter le jeu ?</h2>
            <a href="MenuDemarrage.html"><button class="confirm" id="confirmBtn">Oui</button></a>
            <button class="cancel" id="cancelBtn">Non</button>
        </div>
    </div>

    <div class="taches ouvrirMaily">
        <div>
            <img src="" alt="">
        </div>
        <p>Ouvrir l'application Maily</p>
        <img src="../images/mailyIcon.png" class="icon-quete" alt="icone de l'application maily">
    </div>
    <div class="taches suppMail">
        <div>
            <img src="" alt="">
        </div>
        <p>Supprimer 5 mauvais mails : 0 / 5</p>
        <img src="../images/mailyIcon.png" class="icon-quete" alt="icone de l'application maily">
    </div>
    <div class="taches garderMail">
        <div>
            <img src="" alt="">
        </div>
        <p>Effectuer la tâche du bon mail</p>
        <img src="../images/mailyIcon.png" class="icon-quete" alt="icone de l'application maily">
    </div>

</main>
<footer>
    <a id="QuitPartie" onclick="" class="logo">
        <img src="../images/mail-fishing-logo.png" alt="logo du jeu">
    </a>
    <nav>
        <!--
        <a href="">
            <img src="../images/browser-icon.png" alt="icone du navigateur">
        </a>
        <a href="">
            <img src="../images/Message.png" alt="icone de la messagerie">
        </a>-->
        <div id="appContainerQuetes" class="app-container lockedQuetes">
            <!-- .locked = icône verrouillée (changer ou retirer la classe pour déverrouiller) -->
            <a href="maily.html" class="app-link" aria-disabled="true" tabindex="-1">
                <img class="maily" src="../images/mailyIcon.png" alt="icone de l'application de mail">
            </a>
            <!-- badge cadenas (SVG inline pour pas dépendre d'une image externe) -->
            <span id="lockerQuetes" class="lock-badge">
                    <svg viewBox="0 0 24 24" width="14" height="14" role="img" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1zM9 6a3 3 0 0 1 6 0v2H9V6z"
                              fill="currentColor"/>
                    </svg>
                </span>
        </div>
        <a href="bureau.html" class="active">
            <img class="iconeFichier" src="../images/fichier-text-icon.png" alt="icone de l'application de fichier">
        </a>
    </nav>
    <!--
    <a href="JavaScript:void(0)" onclick="fonctions" class="icon-notification">
        <img src="../images/notification-icon.png" alt="logo du jeu">
    </a>-->
</footer>
<script src="../main.js"></script>
</body>
</html>
