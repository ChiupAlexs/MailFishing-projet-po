<!-- Fenêtre tutoriel -->
<div id="tutoriel" class="tutoriel hidden">
    <div class="perso">
        <video id="perso-video" autoplay muted playsinline></video>
    </div>
    <img class="dialog-pointer" src="../images/dialog pointer.png" alt="pointeur de dialogue">
    <div class="bulle">
        <p id="tuto-text">Bienvenue ! Voici tes quêtes. Tu devras accomplir chaque tâche pour progresser dans le
            jeu.</p>
        <div class="tuto-buttons">
            <button id="btn-suivant">Suivant</button>
            <button id="btn-ok" class="hidden">OK</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const tutoriel = document.getElementById("tutoriel");
        const persoVideo = document.getElementById("perso-video");
        const tutoText = document.getElementById("tuto-text");
        const btnSuivant = document.getElementById("btn-suivant");
        const btnOk = document.getElementById("btn-ok");
        const bulle = document.querySelector(".bulle");
        const dialogPointer = document.querySelector(".dialog-pointer");

        const sonApparition = new Audio("../music/animal-crossing-catch-sound.mp3");
        const sonPop = new Audio("../music/pop-animal-crossing.m4a");

        const etapes = [

            { texte: "BONJOUR! Tu dois être le nouveau! Je suis ton Boss! Je vais t'expliquer ce que tu dois faire aujourd'hui !",
                video: "../vidéos/frame1.mp4" },
            { texte: "ATTENTION! Je ne vais pas non plus te donner toute la journée pour faire ton travail Haha!",
                video: "../vidéos/frame2.mp4" },
            { texte: "Tu auras 5 minutes pour faire ton boulot, ne perds pas de temps inutilement ;)",
                video: "../vidéos/frame1.mp4" },
            { texte: "Si tu fais trop d'erreurs, je serai obligé de te licencier.",
                video: "../vidéos/frame2.mp4" },
            { texte: "Voici tes tâches... Tu devras toutes les accomplir pour progresser.",
                video: "../vidéos/frame3.mp4" },
            { texte: "Bon.. au travail! Moi je vais m'occuper du problème qui concerne la timbreuse...",
                video: "../vidéos/frame4.mp4" },
        ];

        let index = 0;

        // fonction utilitaire pour relancer une animation CSS
        function restartCSSAnimation(el, clsName) {
            if (!el) return;
            el.classList.remove(clsName);
            // force reflow
            void el.offsetWidth;
            el.classList.add(clsName);
        }

        function afficherEtape(i, initial = false) {
            // si c'est le tout premier affichage, on lance les animations "appear" une seule fois
            if (initial) {
                bulle.classList.add("appear");
                dialogPointer.classList.add("appear");
                persoVideo.classList.add("appear");
            } else {
                // uniquement une petite animation d'update (pas de translateX!)
                restartCSSAnimation(bulle, "update");
                restartCSSAnimation(dialogPointer, "update");
                // on peut aussi faire une micro-animation sur la vidéo (facultatif)
                // restartCSSAnimation(persoVideo, "appear"); // <-- si tu veux ré-animer la vidéo, mais pas nécessaire
            }

            // changement de vidéo + texte
            persoVideo.src = etapes[i].video;
            persoVideo.play().catch(err => console.log("Lecture bloquée :", err));
            tutoText.textContent = etapes[i].texte;

            // gestion boutons
            if (i === etapes.length - 1) {
                btnSuivant.classList.add("hidden");
                btnOk.classList.remove("hidden");
            } else {
                btnSuivant.classList.remove("hidden");
                btnOk.classList.add("hidden");
            }
        }

        // ouverture tutoriel si non vu
        if (!sessionStorage.getItem("tutorielVu")) {
            tutoriel.classList.remove("hidden");
            // afficher la première étape ET lancer l'animation d'apparition
            afficherEtape(index, true);

            sonApparition.currentTime = 0;
            sonApparition.play().catch(err => console.log("Lecture bloquée :", err));
        }

        // événements
        btnSuivant.addEventListener("click", () => {
            if (index < etapes.length - 1) {
                index++;
                afficherEtape(index, false);

                sonPop.currentTime = 0;
                sonPop.play().catch(err => console.log("Lecture bloquée :", err));
            }
        });

        btnOk.addEventListener("click", () => {
            tutoriel.classList.add("hidden");
            sessionStorage.setItem("tutorielVu", "true");
        });
    });
</script>
<script src="../main.js"></script>
</body>
</html>
