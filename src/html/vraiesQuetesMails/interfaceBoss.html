<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Excel</title>
    <link rel="stylesheet" href="../../css/vraiesQuetesMails/interfaceBoss.css">
</head>
<body>
<header>
    <h1>Données Utilisateur</h1>
    <div class="shine" id="shine"></div>
    <h1 style="color: white; text-align: center; line-height: 100px;"></h1>
</header>
<table id="excelTable">
    <thead>
    <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Email</th>
        <th>Âge</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td><input type="text" placeholder="Nom"></td>
        <td><input type="text" placeholder="Prénom"></td>
        <td><input type="email" placeholder="Email"></td>
        <td><input type="number" placeholder="Âge"></td>
    </tr>
    </tbody>
</table>

<div class="btn-container">
    <button id="addRow">+ Ajouter une ligne</button>
    <button id="removeRow">- Retirer une ligne</button>
    <button id="saveData">💾 Sauvegarder les données</button>
</div>

<p id="message"></p>
<script src="../../main.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }

        const buttonBoss = document.getElementById("saveData");
        if (buttonBoss) {
            buttonBoss.addEventListener('click', () => {
                localStorage.setItem("pagePrincipale", "true");
            });
        }
    });

    // Effet visuel du "shine"
    const shine = document.getElementById('shine');

    function animateShine() {
        shine.style.left = '-50%';
        shine.style.transition = 'none';
        setTimeout(() => {
            shine.style.transition = 'left 1s ease-in-out';
            shine.style.left = '100%';
        }, 50);
        setTimeout(animateShine, 1000 + Math.random() * 2000);
    }

    animateShine();

    const addBtn = document.getElementById("addRow");
    const removeBtn = document.getElementById("removeRow");
    const saveBtn = document.getElementById("saveData");
    const message = document.getElementById("message");

    // ➕ Ajouter une ligne
    addBtn.addEventListener("click", () => {
        let table = document.getElementById("excelTable").getElementsByTagName("tbody")[0];
        let newRow = table.insertRow();
        ["Nom", "Prénom", "Email", "Âge"].forEach(type => {
            let cell = newRow.insertCell();
            let input = document.createElement("input");
            input.type = (type === "Âge") ? "number" : (type === "Email" ? "email" : "text");
            input.placeholder = type;
            cell.appendChild(input);
        });
    });

    // ➖ Supprimer une ligne
    removeBtn.addEventListener("click", () => {
        const tableBody = document.getElementById("excelTable").getElementsByTagName("tbody")[0];
        const rowCount = tableBody.rows.length;
        if (rowCount > 1) {
            tableBody.deleteRow(rowCount - 1);
        } else {
            message.textContent = "⚠️ Impossible de supprimer la dernière ligne.";
            message.className = "error";
        }
    });

    function allFieldsValid() {
        return [...document.querySelectorAll("#excelTable tbody input")]
            .every(input => input.value.trim() !== "");
    }

    // Vérifie la présence et la validité des utilisateurs requis
    function checkUsers() {
        const rows = [...document.querySelectorAll("#excelTable tbody tr")];
        let foundMorel = false;
        let foundDupont = false;

        rows.forEach(row => {
            const inputs = row.querySelectorAll("input");
            const nom = inputs[0].value.trim().toLowerCase();
            const prenom = inputs[1].value.trim().toLowerCase();
            const email = inputs[2].value.trim().toLowerCase();
            const age = parseInt(inputs[3].value.trim());

            // Vérifie Morel Léa
            if (nom === "morel" && prenom === "léa" && email === "morel.lea@gngngn.ch" && age === 25) {
                foundMorel = true;
            }

            // Vérifie Dupont Mathis
            if (nom === "dupont" && prenom === "mathis" && email === "dupont.mathis@gngngn.ch" && age === 30) {
                foundDupont = true;
            }
        });

        return {foundMorel, foundDupont};
    }

    // 💾 Sauvegarde
    saveBtn.addEventListener("click", () => {
        if (!allFieldsValid()) {
            message.textContent = "⚠️ Remplis tous les champs avant de sauvegarder.";
            message.className = "error";
            return;
        }

        const {foundMorel, foundDupont, hasWrongMorel, hasWrongDupont} = checkUsers();

        // ✅ Les deux corrects
        if (foundMorel && foundDupont) {
            message.textContent = "✅ Données sauvegardées avec succès !";
            message.className = "success";
            addBtn.disabled = true;
            setTimeout(() => window.close(), 2000);
        }
        // ❌ Un trouvé et l’autre incorrect
        else if (foundMorel || foundDupont) {
            message.textContent = "❌ Utilisateurs manquants.";
            message.className = "error";
        }
        // ❌ Aucun trouvé
        else {
            message.textContent = "❌ Utilisateurs introuvables.";
            message.className = "error";
        }
    });
</script>
</body>
</html>
