<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offre d'emploi - WorkNet</title>
    <link rel="stylesheet" href="../../css/vraiesQuetesMails/queteLellouche.css">
</head>
<body>

<div class="container" id="Activation-licences">

    <div class="licences">
        <h2>Activation codes licences</h2>
        <p>Entrez vos codes de licences pour activer les produits.</p>
    </div>

    <div class="inputLicence" id="licence-input">
        <div class="licenceWord" id="licenceWord">
            <input inputmode="latin" pattern="[A-Za-z0-9]{4}" maxlength="4" aria-label="segment 1" class="code"
                   required/>
            <span class="sep">-</span>
            <input inputmode="latin" pattern="[A-Za-z0-9]{4}" maxlength="4" aria-label="segment 2" class="code"
                   required/>
            <span class="sep">-</span>
            <input inputmode="latin" pattern="[A-Za-z0-9]{4}" maxlength="4" aria-label="segment 3" class="code"
                   required/>
            <span class="sep">-</span>
            <input inputmode="latin" pattern="[A-Za-z0-9]{4}" maxlength="4" aria-label="segment 4" class="code"
                   required/>
        </div>
        <div class="licenceExcel" id="licenceExcel">
            <input inputmode="latin" pattern="[A-Za-z0-9]{4}" maxlength="4" aria-label="segment 1" class="code"
                   required/>
            <span class="sep">-</span>
            <input inputmode="latin" pattern="[A-Za-z0-9]{4}" maxlength="4" aria-label="segment 2" class="code"
                   required/>
            <span class="sep">-</span>
            <input inputmode="latin" pattern="[A-Za-z0-9]{4}" maxlength="4" aria-label="segment 3" class="code"
                   required/>
            <span class="sep">-</span>
            <input inputmode="latin" pattern="[A-Za-z0-9]{4}" maxlength="4" aria-label="segment 4" class="code"
                   required/>
        </div>
    </div>

    <p class="indice">Format : <code>XXXX-XXXX-XXXX-XXXX</code> (lettres et chiffres)</p>

    <div class="apply">
        <button id="apply-btn">Activer</button>
    </div>
</div>

<div class="popConfirm" id="confirmPop">
    <h2>Vos licences ont bien été activées</h2>
    <img src="../../images/check-icon.png" height="90" width="90"/>
    <p>Vous pouvez fermer la page.</p>
    <div class="fermer">
        <button id="closeBtn" class="closeBtn">Fermer</button>
    </div>
</div>
<script src="../../main.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }

        const buttonLellouche = document.getElementById("closeBtn");

        if (buttonLellouche) {
            buttonLellouche.addEventListener('click', () => {
                localStorage.setItem("pagePrincipale", "true");
            });
        }

        const applyBtn = document.getElementById("apply-btn");
        const ActLic = document.getElementById("Activation-licences");
        const confirmPop = document.getElementById("confirmPop");
        const closeBtn = document.getElementById("closeBtn");

        const fields = document.querySelectorAll(".code");

        // Message d’erreur : champs incomplets
        const errorMsg = document.createElement("p");
        errorMsg.style.color = "red";
        errorMsg.style.fontSize = "14px";
        errorMsg.style.display = "none";
        errorMsg.textContent = "Chaque champ doit contenir exactement 4 caractères.";
        ActLic.appendChild(errorMsg);

        // Message d’erreur : licence invalide
        const errorInvalide = document.createElement("p");
        errorInvalide.style.color = "red";
        errorInvalide.style.fontSize = "14px";
        errorInvalide.style.display = "none";
        errorInvalide.textContent = "Licence invalide.";
        ActLic.appendChild(errorInvalide);

        // Auto-majuscule + filtre caractères
        fields.forEach((f, i) => {
            f.addEventListener("input", () => {
                f.value = f.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
                if (f.value.length === 4 && i < fields.length - 1) {
                    fields[i + 1].focus();
                }
                if (f.value.length === 4) {
                    f.style.borderColor = "";
                }
            });

            f.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && f.value.length === 0 && i > 0) {
                    fields[i - 1].focus();
                }
            });
        });

        // Validation
        applyBtn.addEventListener("click", () => {
            let allFilled = true;

            fields.forEach(f => {
                if (f.value.length !== 4) {
                    allFilled = false;
                    f.style.borderColor = "red";
                }
            });

            // Si les champs ne sont pas remplis correctement
            if (!allFilled) {
                errorMsg.style.display = "block";
                errorInvalide.style.display = "none";
                return;
            }

            // Si les champs sont remplis, on valide les licences
            if (validerLicences()) {
                errorMsg.style.display = "none";
                errorInvalide.style.display = "none";
                ActLic.style.display = "none";
                confirmPop.style.display = "block";
            } else {
                errorMsg.style.display = "none";
                errorInvalide.style.display = "block";
            }
        });

        closeBtn.addEventListener("click", () => {
            window.close();
        });

        function validerLicences() {
            // On récupère les inputs de chaque groupe
            const licenceWordInputs = document.querySelectorAll("#licenceWord .code");
            const licenceExcelInputs = document.querySelectorAll("#licenceExcel .code");

            // On concatène les valeurs (sans les tirets)
            const licenceWord = Array.from(licenceWordInputs).map(i => i.value).join("");
            const licenceExcel = Array.from(licenceExcelInputs).map(i => i.value).join("");

            // Vérification
            return (
                licenceWord === "L4D2R2D2RDR2C3PO" &&
                licenceExcel === "A4UP3TMKE7Q64HU8"
            );
        }
    });
</script>

</body>
</html>
